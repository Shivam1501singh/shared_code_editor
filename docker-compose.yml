services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: syncode-server
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - CLIENT_URL=http://localhost:3000
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: syncode-frontend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NEXT_PUBLIC_SOCKET_URL=http://localhost:4000
      - NEXTAUTH_URL=http://localhost:3000
    depends_on:
      - server
    restart: unless-stopped
